<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New Creation: GOTY Edition</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>NEW CREATION</h1>
    <canvas id="gameCanvas" width="800" height="600"></canvas>
    <div id="ui-layer">
        <button id="playButton">Play</button>
        <button id="retryButton">Retry</button>
        <div id="perkSelection">
            <h3>Stufenaufstieg! Wähle einen Segen:</h3>
            <button class="perkButton" data-perk="speed">Eifer x 1.2</button>
            <button class="perkButton" data-perk="damage">Zorn x 1.25</button>
            <button class="perkButton" data-perk="shotgun">Segen +10%</button>
        </div>
    </div>
    <div id="infoPopup" class="popup">
        <p id="infoText">Hier steht die Gegnerinfo...</p>
        <button id="infoOkButton">OK</button>
    </div>
    <div id="lootboxPopup" class="popup">
        <p id="lootboxText">Lootbox Text...</p>
        <button id="lootboxOpenButton">Öffnen!</button>
        <button id="lootboxOkButton" style="display: none;">OK</button>
    </div>

    <script src="constants.js"></script>
    <script src="state.js"></script>
    <script src="utils.js"></script>
    <script src="icons.js"></script>
    <script src="assets.js"></script>
    <script src="player.js"></script>
    <script src="enemies.js"></script>
    <script src="projectiles.js"></script>
    <script src="towers.js"></script>
    <script src="lootbox.js"></script>
    <script src="ui.js"></script>
    <script src="sparks.js"></script>
    <script src="devilboss.js"></script>
    <script src="main.js"></script>
</body>
</html>
